name: Deploy API

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy a new build, or roll back to the saved previous copy
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Build
        run: pnpm run build

      - name: Pack app
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.scripts = pkg.scripts || {};
            pkg.scripts.start = "node dist/src/main.js";
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '
          tar -czf release.tar.gz \
            dist \
            node_modules \
            package.json \
            pnpm-lock.yaml \
            prisma \
            prisma.config.ts \
            generated

      - name: Prepare upload directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            rm -rf "$HOME/api-upload"
            mkdir -p "$HOME/api-upload"

      - name: Upload app to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: release.tar.gz
          target: api-upload/

      - name: Publish app and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            export NVM_DIR="$HOME/.nvm"
            # shellcheck disable=SC1091
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            APP_ROOT="$HOME/public_html"
            STAGE="$HOME/api-upload"
            PREV="$HOME/previous"

            test -f "$STAGE/release.tar.gz"
            test -f "$APP_ROOT/.env"

            tar -xzf "$STAGE/release.tar.gz" -C "$STAGE"
            rm -f "$STAGE/release.tar.gz"
            test -f "$STAGE/dist/src/main.js"
            test -f "$STAGE/package.json"

            if [ -f "$APP_ROOT/dist/src/main.js" ]; then
              rm -rf "$PREV"
              mkdir -p "$PREV"
              rsync -a \
                --exclude .htaccess \
                --exclude error_pages \
                --exclude .env \
                --exclude releases \
                --exclude current \
                --exclude shared \
                --exclude ecosystem.config.js \
                "$APP_ROOT"/ "$PREV"/
              echo "Saved live app to $PREV"
            else
              echo "No live app yet; skipping previous snapshot"
            fi

            rsync -a --delete \
              --exclude .htaccess \
              --exclude error_pages \
              --exclude .env \
              "$STAGE"/ "$APP_ROOT"/
            rm -rf "$STAGE"

            cd "$APP_ROOT"
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            ./node_modules/.bin/prisma migrate deploy
            pnpm run sync:permissions

            fuser -k 3000/tcp || true

            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:3000/api/v1/health" >/dev/null; then
                echo "API healthy after ${i}s"
                exit 0
              fi
              sleep 1
            done

            echo "API did not become healthy on port 3000"
            exit 1

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Restore previous app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            export NVM_DIR="$HOME/.nvm"
            # shellcheck disable=SC1091
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            APP_ROOT="$HOME/public_html"
            PREV="$HOME/previous"

            test -f "$PREV/dist/src/main.js"
            test -f "$PREV/package.json"
            test -f "$APP_ROOT/.env"

            rsync -a --delete \
              --exclude .htaccess \
              --exclude error_pages \
              --exclude .env \
              "$PREV"/ "$APP_ROOT"/

            fuser -k 3000/tcp || true

            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:3000/api/v1/health" >/dev/null; then
                echo "API rolled back and healthy after ${i}s"
                exit 0
              fi
              sleep 1
            done

            echo "API did not become healthy on port 3000 after rollback"
            exit 1
